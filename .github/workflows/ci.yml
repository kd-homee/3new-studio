name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --no-coverage --passWithNoTests
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build-only verification of the production Dockerfile. Images are built on the VPS with
      # the real NEXT_PUBLIC_* values from its .env, so nothing is pushed to a registry here.
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-placeholder
          cache-from: type=gha
          cache-to: type=gha,mode=max
